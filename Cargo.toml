[package]
name = "qecs"
version = "0.39.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Provision a strong, ephemeral Huawei Cloud VM, run one job, throw it away."
repository = "https://github.com/araujoviana/qecs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"], default-features = false }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
colog = "1.3"
colored = "3"
dirs = "6"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
ignore = "0.4"
indicatif = "0.17"
libc = "0.2"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "gzip", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tabled = "0.20"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "signal"] }
toml = "0.8"
tempfile = "3"
zstd = { version = "0.13", features = ["zstdmt"] }

[dev-dependencies]
assert_cmd = "2"
criterion = "0.5"
predicates = "3"
wiremock = "0.6"

[lib]
name = "qecs"
path = "src/lib.rs"

[[bin]]
name = "qecs"
path = "src/main.rs"

[[bench]]
name = "micro"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
